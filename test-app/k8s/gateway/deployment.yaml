apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway
  namespace: minishop

spec:
  replicas: 1

  selector:
    matchLabels:
      app: gateway

  template:
    metadata:
      labels:
        app: gateway

    spec:
      containers:
        - name: gateway
          image: test-app-gateway:v6
          imagePullPolicy: IfNotPresent

          ports:
            - containerPort: 5000
