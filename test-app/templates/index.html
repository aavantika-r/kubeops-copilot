<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MiniShop</title>

    <style>
        *{box-sizing:border-box;}

        body{
            margin:0;
            font-family:Arial,sans-serif;
            background:#f5f6f8;
            color:#222;
        }

        header{
            background:#111827;
            color:white;
            padding:20px 60px;
            display:flex;
            justify-content:space-between;
            align-items:center;
        }

        header h1{
            margin:0;
            font-size:28px;
        }

        .cart{
            background:white;
            color:#111827;
            padding:10px 18px;
            border-radius:20px;
            font-weight:bold;
            text-decoration:none;
        }

        .hero{
            text-align:center;
            padding:45px 20px 25px;
        }

        .hero h2{
            font-size:32px;
            margin-bottom:10px;
        }

        .hero p{
            color:#666;
        }

        .products{
            max-width:1100px;
            margin:20px auto 60px;
            padding:0 20px;
            display:grid;
            grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
            gap:25px;
        }

        .product{
            background:white;
            border-radius:12px;
            overflow:hidden;
            box-shadow:0 4px 15px rgba(0,0,0,.08);
            transition:.2s;
        }

        .product:hover{
            transform:translateY(-5px);
        }

        .product img{
            width:100%;
            height:190px;
            object-fit:contain;
            background:#f3f4f6;
            padding:20px;
        }

        .product-info{
            padding:18px;
        }

        .product-info h3{
            margin:0 0 8px;
            font-size:20px;
        }

        .price{
            font-size:19px;
            font-weight:bold;
            margin-bottom:15px;
            color:#16a34a;
        }

        button{
            width:100%;
            border:none;
            padding:11px;
            border-radius:7px;
            background:#2563eb;
            color:white;
            font-size:15px;
            cursor:pointer;
        }

        button:hover{
            background:#1d4ed8;
        }

        footer{
            text-align:center;
            padding:20px;
            background:#111827;
            color:#aaa;
        }
    </style>
</head>

<body>

<header>
    <h1>🛒 MiniShop</h1>
    <a href="/cart" class="cart">🛒 View Cart</a>
</header>

<section class="hero">
    <h2>Welcome to MiniShop</h2>
    <p>Products are served by the Product Microservice</p>
</section>

<section class="products">

{% for product in products %}

<div class="product">

   <img src="/images/{{ product.name|lower }}.png"
     alt="{{ product.name }}">

    <div class="product-info">

        <h3>{{ product.name }}</h3>

        <div class="price">₹ {{ product.price }}</div>

        <button onclick="addToCart({{ product.id }})">
            Add to Cart
        </button>

    </div>

</div>

{% endfor %}

</section>

<footer>
    MiniShop • Kubernetes Test Application
</footer>

<script>
async function addToCart(productId){

    const response = await fetch("/cart", {
        method:"POST",
        headers:{
            "Content-Type":"application/json"
        },
        body:JSON.stringify({
            product_id:productId
        })
    });

    const data = await response.json();

    if(response.ok){
        alert(data.product.name + " added to cart!");
    }else{
        alert(data.error);
    }
}
</script>

</body>
</html>
