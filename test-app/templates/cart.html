<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>My Cart - MiniShop</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f5f6f8;
        }

        .container {
            max-width: 900px;
            margin: 50px auto;
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.08);
        }

        h1 {
            text-align: center;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 30px;
        }

        th, td {
            padding: 15px;
            border-bottom: 1px solid #ddd;
            text-align: left;
        }

        th {
            background: #111827;
            color: white;
        }

        .total {
            text-align: right;
            font-size: 22px;
            font-weight: bold;
            margin-top: 25px;
        }

        .delete-btn {
            background: #dc2626;
            color: white;
            border: none;
            padding: 8px 14px;
            border-radius: 6px;
            cursor: pointer;
        }

        .delete-btn:hover {
            background: #b91c1c;
        }

        .back {
            display: inline-block;
            margin-top: 25px;
            padding: 10px 18px;
            background: #2563eb;
            color: white;
            text-decoration: none;
            border-radius: 7px;
        }
    </style>
</head>

<body>

<div class="container">

    <h1>🛒 My Cart</h1>

    {% if cart_items %}

    <table>

        <tr>
            <th>Product</th>
            <th>Price</th>
            <th>Quantity</th>
            <th>Subtotal</th>
            <th>Action</th>
        </tr>

        {% for item in cart_items %}

        <tr>
            <td>{{ item[1] }}</td>

            <td>
                ₹{{ "%.2f"|format(item[2]) }}
            </td>

            <td>
                {{ item[3] }}
            </td>

            <td>
                ₹{{ "%.2f"|format(item[4]) }}
            </td>

            <td>
                <button
                    class="delete-btn"
                    onclick="deleteItem({{ item[0] }})">
                    Delete
                </button>
            </td>
        </tr>

        {% endfor %}

    </table>

    <div class="total">
        Total: ₹{{ "%.2f"|format(total) }}
    </div>

    {% else %}

    <h3 style="text-align:center;">
        Your cart is empty.
    </h3>

    {% endif %}

    <a href="/" class="back">
        ← Continue Shopping
    </a>

</div>

<script>
async function deleteItem(itemId) {

    const response = await fetch(`/cart/delete/${itemId}`, {
        method: "POST"
    });

    if (response.ok) {
        location.reload();
    } else {
        alert("Failed to delete item");
    }
}
</script>

</body>
</html>
