<!DOCTYPE html>
<html>
<head>
<title>Payment</title>

<style>
body{
font-family:Arial;
background:#f5f6f8;
margin:0;
}

.box{
width:700px;
margin:40px auto;
background:white;
padding:30px;
border-radius:10px;
}

.row{
display:flex;
justify-content:space-between;
padding:12px 0;
border-bottom:1px solid #ddd;
}

.total{
font-size:28px;
font-weight:bold;
text-align:right;
margin-top:20px;
}

button{
width:100%;
padding:14px;
background:#16a34a;
border:none;
color:white;
font-size:18px;
border-radius:8px;
margin-top:25px;
cursor:pointer;
}
</style>

</head>

<body>

<div class="box">

<h1>💳 Payment</h1>

{% for i in items %}

<div class="row">

<span>{{ i[0] }} × {{ i[2] }}</span>

<span>₹ {{ i[1]*i[2] }}</span>

</div>

{% endfor %}

<div class="total">

Total : ₹ {{ total }}

</div>

<button onclick="location.href='/pay'">

Pay Now

</button>

</div>

</body>
</html>
